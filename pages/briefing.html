<section class="hv-panel"><header class="hv-section-head"><div><p class="hv-eyebrow">Alles voor vertrek</p><h2>Jouw wedstrijdbriefing.</h2><p>Verzamelen, aftrap, tenue en ontvangst op één plek.</p></div><button class="hv-button hv-button-outline" data-brief-print type="button">Print wedstrijdbriefing</button></header><div class="hv15-controls"><label>Wedstrijd<select data-brief-match></select></label><label>Team<select data-brief-team></select></label></div></section>
<div class="hv15-columns"><section class="hv-panel hv15-main-panel" data-brief-preview></section><section class="hv-panel hv15-main-panel"><p class="hv-eyebrow">Afspreken met jouw team</p><h2>Praktische afspraken</h2><p data-brief-access></p><form class="hv15-form" data-brief-form><fieldset><label>Verzameltijd<input name="gatherTime" type="time" required></label><label>Verzamelplek<input name="gatherLocation" required minlength="3" maxlength="240"></label><label>Vervoer<input name="transport" maxlength="240"></label><label>Contact via teamleiding<input name="contact" maxlength="240"></label><label>Tenueafspraak<input name="kitNote" maxlength="240"></label><label class="hv15-check"><input name="kitConfirmed" type="checkbox"> Tenue afgestemd en gecontroleerd</label><label>Aanvullende teaminformatie<textarea name="notes" rows="3" maxlength="1200"></textarea></label><label>Wijzigingsreden<textarea name="reason" required minlength="8" rows="2"></textarea></label><button class="hv-button hv-button-dark" type="submit">Briefing vastleggen</button></fieldset></form></section></div>
<section class="hv-panel" data-brief-kits></section><p class="hv15-feedback" data-brief-feedback role="status" aria-live="polite"></p>
