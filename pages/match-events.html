<div class="hv-content-grid mev-layout" data-mev-root>
  <section class="hv-panel" aria-labelledby="mev-heading">
    <header class="hv-section-head">
      <div><h2 id="mev-heading">Wedstrijdgebeurtenis toevoegen</h2><p>Leg doelpunten, kaarten en bijzonderheden vast in het wedstrijdformulier.</p></div>
    </header>
    <p class="mev-gate" data-mev-gate><span data-mev-gate-text></span> <a href="#regie" data-mev-kickoff-link hidden>Open Wedstrijdregie ↗</a></p>
    <form data-mev-form>
      <fieldset data-mev-fields disabled>
        <legend class="mev-sr">Nieuwe wedstrijdgebeurtenis</legend>
        <label>Gebeurtenis<select name="type" required>
          <option value="">Kies een gebeurtenis</option>
          <option value="goal">Doelpunt</option>
          <option value="penalty-goal">Benutte strafschop</option>
          <option value="own-goal">Eigen doelpunt</option>
          <option value="yellow">Gele kaart</option>
          <option value="second-yellow">Tweede gele kaart</option>
          <option value="red">Rode kaart</option>
          <option value="incident">Bijzonderheid</option>
        </select></label>
        <label>Wedstrijdminuut<input type="number" name="minute" min="0" step="1" inputmode="numeric" required></label>
        <label>Team<select name="side">
          <option value="">Kies een team</option>
          <option value="home">Duindorp SV</option>
          <option value="away">SVV Scheveningen</option>
        </select></label>
        <label>Speler<select name="player" data-mev-players></select></label>
        <label class="mev-note"><span data-mev-note-label>Toelichting (optioneel)</span><textarea name="description" rows="2" maxlength="350"></textarea></label>
        <button type="submit" class="hv-button hv-button-dark">Gebeurtenis vastleggen</button>
      </fieldset>
    </form>
    <p class="mev-notice" data-mev-notice role="status" hidden></p>
  </section>
  <section class="hv-panel" aria-labelledby="mev-history-heading">
    <header class="hv-section-head">
      <div><h2 id="mev-history-heading">Wedstrijdgebeurtenissen</h2><p>Chronologisch overzicht voor de scheidsrechter.</p></div>
    </header>
    <p class="mev-gate" data-mev-empty>Er zijn nog geen gebeurtenissen vastgelegd.</p>
    <ol class="mev-history" data-mev-history></ol>
  </section>
</div>
