name: Haagv VPS08 production activate (manual)
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full candidate main commit SHA
        required: true
        type: string
      candidate_id:
        description: Exact candidate ID from the successful candidate build
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: haagv-platform-production-release
  cancel-in-progress: false
jobs:
  activate:
    if: github.repository == 'haaglandenv/platform' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: [self-hosted, Linux, X64, dg-vps-08, haagv-platform-production]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      CANDIDATE_ID: ${{ inputs.candidate_id }}
    steps:
      - name: activate approved candidate
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 -c 'import json,os; print(json.dumps({"githubToken":os.environ["GH_TOKEN"]}))' | sudo -n /usr/local/libexec/haagv-platform-production/release.py activate --sha "$RELEASE_SHA" --candidate "$CANDIDATE_ID" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
