name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: haagv-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HAAGV_APP_ORIGIN: http://127.0.0.1:4175
      HAAGV_DATA_MODE: local
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/android/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm --prefix apps/android ci
      - run: npm --prefix apps/android run typecheck
      - run: npm --prefix apps/android run bundle
      - run: npm audit --audit-level=moderate && npm --prefix apps/android audit --audit-level=moderate
