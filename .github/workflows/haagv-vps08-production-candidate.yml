name: Haagv VPS08 production candidate (manual, no activation)
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full approved main commit SHA (40 lowercase hex characters)
        required: true
        type: string
      config_id:
        description: Preloaded immutable runtime profile ID (e.g. production-v1)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: haagv-platform-production-build
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'haaglandenv/platform' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      HVCUP_APP_ORIGIN: ${{ vars.HVCUP_APP_ORIGIN }}
      HVCUP_DATA_MODE: ${{ vars.HVCUP_DATA_MODE }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      CONFIG_ID: ${{ inputs.config_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Verify exact SHA, required CI and four public values
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 -c 'import json,os; names=("HVCUP_APP_ORIGIN","HVCUP_DATA_MODE","NEXT_PUBLIC_SUPABASE_URL","NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"); print(json.dumps({"githubToken":os.environ["GH_TOKEN"],"publicConfig":{n:os.environ.get(n,"") for n in names}}))' | python3 ops/release.py preflight --environment production --sha "$RELEASE_SHA" --config-id "$CONFIG_ID"
  candidate:
    needs: preflight
    if: github.repository == 'haaglandenv/platform' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: [self-hosted, Linux, X64, dg-vps-08, haagv-platform-production]
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      HVCUP_APP_ORIGIN: ${{ vars.HVCUP_APP_ORIGIN }}
      HVCUP_DATA_MODE: ${{ vars.HVCUP_DATA_MODE }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      CONFIG_ID: ${{ inputs.config_id }}
    steps:
      - name: Build isolated candidate on target (never activate)
        shell: bash
        run: |
          set -euo pipefail
          set +x
          invoke() {
            python3 -c 'import json,os; names=("HVCUP_APP_ORIGIN","HVCUP_DATA_MODE","NEXT_PUBLIC_SUPABASE_URL","NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"); print(json.dumps({"githubToken":os.environ["GH_TOKEN"],"publicConfig":{n:os.environ.get(n,"") for n in names}}))' | sudo -n /usr/local/libexec/haagv-platform-production/release.py build --sha "$RELEASE_SHA" --config-id "$CONFIG_ID" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          }
          set +e
          invoke
          result=$?
          set -e
          if [ "$result" -eq 75 ]; then
            sleep 30
            invoke
          else
            exit "$result"
          fi
